{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>RedWall</title><link rel="stylesheet" href="{% static 'css/style.css' %}"></head>
<body>
<header class="top"><a class="brand" href="{% url 'home' %}"><span class="logo">R</span> RedWall</a><nav><a href="{% url 'home' %}">Home</a><a href="{% url 'home' %}#posts">Интересное</a>{% if user.is_authenticated %}<a href="{% url 'profile' %}">Мой профиль</a><a href="{% url 'logout' %}">Выйти</a>{% else %}<a href="{% url 'login' %}">Войти</a><a class="nav-button" href="{% url 'register' %}">Создать аккаунт</a>{% endif %}<button class="theme-button" onclick="document.body.classList.toggle('light')">◐ Тема</button><a href="?lang=ru" class="lang">RU / UZ / EN</a></nav></header>
<main>{% block content %}{% endblock %}</main><footer>RedWall — делись тем, что тебе интересно.</footer>
</body></html>
