{% extends 'feed/base.html' %}{% block content %}<section class="auth-wrap"><div class="auth-info"><p class="eyebrow">СНОВА РАДЫ ТЕБЯ ВИДЕТЬ</p><h1>Твои мысли.<br><span>Твоя лента.</span></h1><p>Войди, чтобы публиковать посты и ставить лайки.</p></div><div class="auth-card"><h2>Войти</h2><p class="muted">Введи логин и пароль</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<p><label for="username">Логин</label><input id="username" name="username" required></p><p><label for="password">Пароль</label><input id="password" name="password" type="password" required></p><button class="button full" type="submit">Войти в аккаунт</button></form><p class="auth-bottom">Нет аккаунта? <a href="{% url 'register' %}">Создать</a></p></div></section>{% endblock %}
